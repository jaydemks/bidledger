name: Daily sync and deploy

on:
  schedule:
    # GitHub drops scheduled runs under load rather than queueing them, so ask
    # twice. The build is idempotent: the second run of a quiet day just
    # rebuilds the same pages.
    - cron: "17 5 * * *"    # 05:17 UTC, after the morning TED publication
    - cron: "37 13 * * *"   # 13:37 UTC, in case the first one never fires
    - cron: "47 19 * * *"   # 19:47 UTC, last chance before the day is lost
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config.json"
      - ".github/workflows/daily.yml"
  workflow_dispatch:
    inputs:
      window_days:
        description: "How many days of notices to pull from TED"
        default: "30"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Pull new notices from TED
        env:
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
        run: python scripts/sync.py

      - name: Commit the updated store
        run: |
          set -eu
          git config user.name  "bidledger-ci"
          git config user.email "actions@github.com"
          git add -A data/
          git diff --staged --quiet && { echo "store unchanged"; exit 0; }
          git commit -m "data: TED sync $(date -u +%F)"
          # Someone may have pushed while the sync was running. The store is
          # append-only and this run holds the freshest copy, so replaying our
          # commit on top and keeping our side of any clash is always correct.
          for attempt in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main
            git push && exit 0
            echo "push race on attempt $attempt, retrying"
          done
          echo "::error::could not push the updated store after 3 attempts"
          exit 1

      - name: Resolve the canonical site URL
        run: |
          url="${{ vars.SITE_URL }}"
          if [ -z "$url" ]; then
            owner=$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')
            url="https://${owner}.github.io/${GITHUB_REPOSITORY#*/}"
          fi
          echo "SITE_URL=$url" >> "$GITHUB_ENV"
          echo "Canonical URL: $url"

      - name: Build the site
        run: cd scripts && python build.py

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Keep the IndexNow request for after the deploy
        uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: indexnow.json
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - id: get
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: indexnow

      - name: Tell IndexNow about the new notices
        if: steps.get.outcome == 'success'
        run: |
          set -eu
          n=$(jq '.urlList | length' indexnow.json)
          echo "submitting $n URLs"
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST             -H 'Content-Type: application/json; charset=utf-8'             --data-binary @indexnow.json             https://api.indexnow.org/indexnow)
          echo "IndexNow replied $code"
          cat response.txt || true
          case "$code" in
            200|202) ;;
            *) echo "::warning::IndexNow returned $code" ;;
          esac
